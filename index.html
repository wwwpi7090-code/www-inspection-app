// ─── SERVICE WORKER REGISTRATION ────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        nw?.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            // New version available — notify UI (handled by swUpdate state)
            window.__swUpdateAvailable = true;
          }
        });
      });
    }).catch(err => console.warn('[SW] Registration failed (expected in dev):', err));
  });
}

// ─── INDEXEDDB LAYER ────────────────────────────────────────
const DB_NAME = 'wwwInspection';
const DB_VERSION = 1;
let _dbInstance = null;
async function openDB() {
  if (_dbInstance) return _dbInstance;
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('inspections')) {
        db.createObjectStore('inspections', {
          keyPath: 'id'
        });
      }
      if (!db.objectStoreNames.contains('photos')) {
        const ph = db.createObjectStore('photos', {
          keyPath: 'photoId'
        });
        ph.createIndex('byInspection', 'inspectionId', {
          unique: false
        });
        ph.createIndex('byDefect', 'defectRef', {
          unique: false
        });
      }
    };
    req.onsuccess = e => {
      _dbInstance = e.target.result;
      resolve(_dbInstance);
    };
    req.onerror = () => reject(req.error);
  });
}
async function dbTx(storeName, mode, fn) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, mode);
    const store = tx.objectStore(storeName);
    try {
      const req = fn(store);
      if (req && req.onsuccess !== undefined) {
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      } else {
        tx.oncomplete = () => resolve(req);
        tx.onerror = () => reject(tx.error);
      }
    } catch (err) {
      reject(err);
    }
  });
}
const dbGetAll = store => dbTx(store, 'readonly', s => s.getAll());
const dbGet = (store, key) => dbTx(store, 'readonly', s => s.get(key));
const dbPut = (store, data) => dbTx(store, 'readwrite', s => s.put(data));
const dbDelete = (store, key) => dbTx(store, 'readwrite', s => s.delete(key));
async function dbGetByIndex(store, indexName, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).index(indexName).getAll(value);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// Read-back verification
async function dbPutVerified(store, data) {
  await dbPut(store, data);
  const key = data[store === 'photos' ? 'photoId' : 'id'];
  const readback = await dbGet(store, key);
  if (!readback) throw new Error(`Read-back failed for ${store}/${key}`);
  return readback;
}

// ─── LOCALSTORAGE MIGRATION ──────────────────────────────────
async function migrateFromLocalStorage() {
  const LS_KEYS = ['www_insp_v3', 'www_insp_v2', 'www_inspections_v1', 'www_inspections'];
  let raw = null;
  let foundKey = null;
  for (const k of LS_KEYS) {
    const v = localStorage.getItem(k);
    if (v) {
      raw = v;
      foundKey = k;
      break;
    }
  }
  if (!raw) return 0;
  let inspections = [];
  try {
    inspections = JSON.parse(raw);
  } catch {
    return 0;
  }
  if (!Array.isArray(inspections) || !inspections.length) return 0;
  let migrated = 0;
  for (const ins of inspections) {
    try {
      const migratedItems = {};
      for (const [itemId, itemData] of Object.entries(ins.items || {})) {
        const photoRefs = [];
        const oldPhotos = itemData.photos || [];
        for (let i = 0; i < oldPhotos.length; i++) {
          const ph = oldPhotos[i];
          const base64 = typeof ph === 'string' ? ph : ph?.data;
          if (!base64 || !base64.startsWith('data:')) continue;
          try {
            const blob = await fetch(base64).then(r => r.blob());
            const photoId = gid();
            await dbPut('photos', {
              photoId,
              inspectionId: ins.id,
              defectRef: itemId,
              seq: i + 1,
              blob,
              caption: ph?.caption || '',
              savedToDevice: false,
              saveStatus: 'ok',
              createdAt: new Date().toISOString()
            });
            photoRefs.push({
              photoId,
              num: ph?.num || i + 1,
              caption: ph?.caption || '',
              saveStatus: 'ok',
              savedToDevice: false
            });
          } catch {/* skip failed photo */}
        }
        migratedItems[itemId] = {
          ...itemData,
          photos: photoRefs
        };
      }
      await dbPut('inspections', {
        ...ins,
        items: migratedItems,
        _migrated: true
      });
      migrated++;
    } catch (err) {
      console.warn('Migration error for inspection:', ins.id, err);
    }
  }

  // Remove old LS data
  LS_KEYS.forEach(k => localStorage.removeItem(k));
  console.log(`[Migration] Migrated ${migrated} inspections from LocalStorage`);
  return migrated;
}

// ─── IMAGE UTILITIES ─────────────────────────────────────────
async function compressImage(file, maxEdge = 1600, quality = 0.75) {
  try {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, maxEdge / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bitmap.width * scale);
    canvas.height = Math.round(bitmap.height * scale);
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    return await new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob returned null')), 'image/jpeg', quality));
  } catch (err) {
    console.warn('[Compress] Falling back to original:', err);
    return file.slice(); // return as Blob
  }
}
function saveToDevice(blob, filename) {
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    return true;
  } catch {
    return false;
  }
}
function photoFilename(fileNo, defectRef, seq) {
  const n = new Date();
  const dt = `${n.getFullYear()}${String(n.getMonth() + 1).padStart(2, '0')}${String(n.getDate()).padStart(2, '0')}-${String(n.getHours()).padStart(2, '0')}${String(n.getMinutes()).padStart(2, '0')}`;
  const safeRef = (defectRef || 'unknown').replace(/[^a-zA-Z0-9-]/g, '-');
  return `${fileNo || 'wpi'}_${safeRef}_${String(seq).padStart(3, '0')}_${dt}.jpg`;
}

// ─── STORAGE MONITORING ──────────────────────────────────────
async function checkStorageQuota() {
  if (!navigator.storage?.estimate) return null;
  try {
    const {
      usage,
      quota
    } = await navigator.storage.estimate();
    await navigator.storage.persist?.();
    return {
      usage,
      quota,
      pct: quota ? Math.round(usage / quota * 100) : 0
    };
  } catch {
    return null;
  }
}

// Assembles the summary only from recorded defect entries.
// No generated prose; every sentence traces to entered data.
function buildExecSummary(ins) {
  const gi = ins.generalInfo || {};
  const addr = gi.address?.asPerTitle || ins.insp?.address || '—';
  const out = [];

  // ── 1. Opening
  out.push(`This report records the findings of a visual, non-invasive residential property inspection ` + `carried out at ${addr} on ${fmtDate(ins.insp?.date)} for ${ins.client?.name || 'the client'}. ` + `The inspection was carried out in accordance with NZS 4306:2005 Residential Property Inspection. ` + `Scope: ${ins.insp?.scope || '—'}.`);

  // ── 2. Weathertightness risk rating (lead item per BOINZ)
  const rating = ins.wt?.rating || '';
  if (rating) {
    let wtPara = `The property has been assessed as carrying a ${rating} weathertightness risk profile.`;
    const hiFactors = WT_FACTORS.filter(f => ins.wt.factors?.[f.id] && f.highRisk.includes(ins.wt.factors[f.id])).map(f => `${f.label}: ${ins.wt.factors[f.id]}`);
    if (hiFactors.length) {
      wtPara += ` The following risk factors were recorded: ${hiFactors.join('; ')}.`;
    }
    if (ins.wt.context) wtPara += ` ${ins.wt.context}`;
    out.push(wtPara);
  } else {
    out.push('A weathertightness risk rating has not been recorded for this property.');
  }

  // ── 3. Significant Defects (only — no maintenance items)
  const sig = [];
  CATS.forEach(cat => cat.items.forEach(item => {
    const d = ins.items?.[item.id];
    if (d?.flagged && d.grade === 'significant') {
      sig.push({
        ...d,
        cat: cat.label.replace(/^\d+\.\s/, ''),
        item: item.l
      });
    }
  }));
  sig.sort((a, b) => parseInt((a.defectRef || 'D-99').replace('D-', ''), 10) - parseInt((b.defectRef || 'D-99').replace('D-', ''), 10));
  if (sig.length) {
    out.push(`${sig.length} item${sig.length > 1 ? 's have' : ' has'} been graded as a Significant Defect. ` + `${sig.length > 1 ? 'These are' : 'This is'} summarised below. ` + `Full entries, including implications and recommendations, are set out in the body of this report.`);
    sig.forEach(d => {
      out.push(`${d.defectRef || '—'} — ${d.cat}, ${d.item}. Location: ${d.location || '—'}. ${d.description || '—'}`);
    });
  } else {
    out.push('No items have been graded as a Significant Defect.');
  }

  // ── 4. Further investigation items
  const fi = [];
  CATS.forEach(cat => cat.items.forEach(item => {
    const d = ins.items?.[item.id];
    if (d?.flagged && (d.axes || []).includes('further_investigation')) {
      fi.push(d.defectRef || item.l);
    }
  }));
  if (fi.length) {
    out.push(`Further investigation is recommended in respect of the following items: ${fi.join(', ')}.`);
  }

  // ── 5. Elevated moisture readings
  const ctrl = parseFloat(ins.moisture?.controlReading);
  const elevated = (ins.moisture?.readings || []).filter(r => {
    const v = parseFloat(r.value);
    return !isNaN(v) && !isNaN(ctrl) && v - ctrl >= 5;
  });
  if (elevated.length) {
    out.push(`${elevated.length} moisture reading${elevated.length > 1 ? 's were' : ' was'} recorded at 5% WME or more above ` + `the control reading of ${ins.moisture.controlReading}% WME taken at ${ins.moisture.controlLocation || '—'}. ` + `Readings were taken with a ${ins.moisture.meterMake || '—'} in ${ins.moisture.meterType || '—'} mode. ` + `Full results are tabulated in the Moisture Test Results section.`);
  }

  // ── 6. Scope limitations
  out.push(`This inspection was visual and non-invasive. Concealed building elements, including those within wall cavities, ` + `beneath floor coverings and above ceiling linings, were not inspected and are excluded from this report. ` + `Areas not inspected: ${ins.insp?.areasNotInspected || '—'}.`);

  // ── 7. HIGH risk — invasive testing + precedent
  if (rating === 'HIGH') {
    out.push(`Where a property is assessed as carrying a HIGH weathertightness risk profile, a non-invasive inspection ` + `alone cannot establish whether moisture ingress has occurred within concealed framing. Invasive moisture ` + `testing by a suitably qualified specialist is recommended before any purchase decision is made. ` + `This recommendation is made having regard to Hepburn v Cunningham.`);
  }
  return out.join('\n\n');
}

  // ── Init: open DB, migrate, load ────────────────────────────
  useEffect(() => {
    async function init() {
      try {
        await openDB();
        const n = await migrateFromLocalStorage();
        if (n) setMigrated(n);
        // Run v1→v2 migration on all inspections
        const rawInspections = await dbGetAll('inspections');
        const inspections = [];
        let anyMigrated = false;
        for (const raw of rawInspections) {
          const {
            ins,
            migrated
          } = migrateToV2(raw);
          if (migrated) {
            await dbPut('inspections', ins);
            anyMigrated = true;
          }
          inspections.push(ins);
        }
        if (anyMigrated) setMigrationBanner(true);
        inspections.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
        setList(inspections);
        setDbReady(true);
        setTimeout(() => setPage('home'), 2000);
        // Storage check
        checkStorageQuota().then(q => {
          if (q && q.pct > 80) setStorageWarning(true);
        });
        // SW update check
        if (window.__swUpdateAvailable) setSwUpdate(true);
        // Online/offline
        window.addEventListener('online', () => setIsOnline(true));
        window.addEventListener('offline', () => setIsOnline(false));
      } catch (err) {
        console.error('Init failed:', err);
        setDbReady(true);
        setTimeout(() => setPage('home'), 2000);
      }
    }
    init();
    return () => {
      window.removeEventListener('online', () => setIsOnline(true));
      window.removeEventListener('offline', () => setIsOnline(false));
    };
  }, []);
  const showToast = (msg, type = 'ok') => {

  };

  // ── Persist inspection (no photos — photos stored separately) ──
  async function saveInspection(ins) {
    const u = {
      ...ins,
      updatedAt: new Date().toISOString()
    };
    try {
      await dbPutVerified('inspections', u);
      setList(p => {
        const i = p.findIndex(x => x.id === u.id);
        const n = [...p];
        i >= 0 ? n[i] = u : n.unshift(u);
        return n;
      });
      setCur(u);
      return u;
    } catch (err) {
      showToast('⚠️ Save failed — retry', 'error');
      throw err;
    }
  }
  function updItem(itemId, patch) {
    return saveInspection({
      ...cur,
      items: {
        ...cur.items,
        [itemId]: {
          ...cur.items[itemId],
          ...patch
        }
      }
    });
  }
  function updF(sec, k, v) {
    return saveInspection({
      ...cur,
      [sec]: {

        [k]: v

  }
  function updWT(k, v) {
    const wt = {
      ...cur.wt,
      factors: {
        ...cur.wt.factors,

    wt.rating = calcWTRisk(wt.factors);

  async function delInsp(id) {
    if (!confirm('Delete this inspection and all its photos?')) return;
    // Delete photos from IndexedDB
    const photos = await dbGetByIndex('photos', 'byInspection', id);
    for (const ph of photos) await dbDelete('photos', ph.photoId);
    await dbDelete('inspections', id);
    setList(p => p.filter(x => x.id !== id));
    setCur(null);
    setPage('home');

  // ── Photo handling ───────────────────────────────────────────
  async function handleFiles(files, itemId) {
    if (!files?.length || !itemId) return;
    const ins = cur;
    const item = ins.items[itemId];
    const existingCount = item.photos?.length || 0;
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      try {
        // 1. Compress
        const blob = await compressImage(file);

        // 2. Build photo record
        const photoId = gid();
        const seq = existingCount + i + 1;
        // Global photo number across inspection
        const allPhotos = Object.values(ins.items).flatMap(d => d.photos || []);
        const globalNum = allPhotos.length + i + 1;
        // Use D-XX ref if available, else itemId
        const defectRef = ins.items[itemId]?.defectRef || itemId;
        // Photo lettered suffix: D-01a, D-01b, D-01c...
        const photoSuffix = String.fromCharCode(97 + i); // a, b, c...
        const photoLabel = `${defectRef}${photoSuffix}`;
        const filename = photoFilename(ins.fileNo, photoLabel, seq);

        // 3. Save to IndexedDB
        const photoRecord = {
          photoId,
          inspectionId: ins.id,
          defectRef,
          seq,
          photoLabel,
          blob,
          caption: '',
          savedToDevice: false,
          saveStatus: 'pending',
          createdAt: new Date().toISOString()
        };
        let saveStatus = 'ok';
        try {
          await dbPutVerified('photos', {
            ...photoRecord,
            saveStatus: 'ok'
          });
        } catch {
          saveStatus = 'fail';
          showToast('🔴 Photo save to app failed — retry', 'error');
        }

        // 4. Save to device Downloads (if enabled)
        let savedToDevice = false;
        if (ins.saveDevicePhotos) {
          savedToDevice = saveToDevice(blob, filename);
          if (!savedToDevice) saveStatus = saveStatus === 'fail' ? 'fail' : 'partial';
        }

        // 5. Update IndexedDB record with final status
        if (saveStatus !== 'pending') {
          await dbPut('photos', {
            ...photoRecord,
            saveStatus,
            savedToDevice
          });
        }

        // 6. Update inspection item with photo reference
        const photoRef = {
          photoId,
          num: globalNum,
          photoLabel,
          caption: '',
          saveStatus,
          savedToDevice
        };
        const updatedPhotos = [...(item.photos || []), photoRef];
        // Re-fetch cur in case multiple files are being processed
        const latestItem = (await dbGet('inspections', ins.id))?.items?.[itemId] || ins.items[itemId];
        await saveInspection({
          ...ins,
          items: {
            ...ins.items,
            [itemId]: {
              ...latestItem,
              photos: [...(latestItem.photos || []), photoRef]
            }
          }
        });
        const statusMsg = savedToDevice ? '✅ Photo saved + downloaded' : saveStatus === 'ok' ? '💾 Photo saved to app' : '⚠️ Partial save — check';
        showToast(statusMsg, saveStatus === 'fail' ? 'error' : 'ok');
      } catch (err) {
        console.error('Photo handling error:', err);
        showToast('🔴 Photo error — please retry', 'error');
      }
    }
    fileRef.current.value = '';
  }
  function onFileInput(e) {
    handleFiles(e.target.files, pendingPhotoItem.current);
  }
  async function deletePhoto(itemId, photoIdx) {
    const d = cur.items[itemId];
    const photoRef = d.photos[photoIdx];
    if (photoRef?.photoId) await dbDelete('photos', photoRef.photoId).catch(() => {});
    const photos = [...d.photos];
    photos.splice(photoIdx, 1);
    await updItem(itemId, {
      photos
    });
    setPhotoMod(null);
    showToast('Photo deleted');
  }

  // ── Defect auto-numbering ────────────────────────────────────
  function nextDefectRef(inspection) {
    // Find highest existing D-XX number
    let max = 0;
    Object.values(inspection.items).forEach(d => {
      if (d.defectRef) {
        const n = parseInt(d.defectRef.replace('D-', ''), 10);
        if (!isNaN(n) && n > max) max = n;
      }
    });
    return `D-${String(max + 1).padStart(2, '0')}`;
  }

  // ── Defect flagging with grade confirmation ──────────────────
  async function toggleFlag(itemId, itemLabel) {
    const d = cur.items[itemId];
    if (d.flagged) {
      // Unflag — keep defectRef (gaps allowed per spec)
      await updItem(itemId, {
        flagged: false,
        grade: '',
        axes: []
      });
    } else {
      // Flag — assign D-XX number if not already assigned
      const defectRef = d.defectRef || nextDefectRef(cur);
      await updItem(itemId, {
        flagged: true,
        status: ST.done,
        defectRef
      });
    }
  }

  // ── Export / Import JSON ────────────────────────────────────
  function exportJSON() {
    if (!cur) return;
    const exportData = {
      wwwExportVersion: "1.0",
      exportedAt: new Date().toISOString(),
      exportedFrom: /Mobi|Android/i.test(navigator.userAgent) ? 'mobile' : 'desktop',
      inspection: {
        ...cur,
        items: Object.fromEntries(Object.entries(cur.items).map(([id, item]) => [id, {
          ...item,
          // Keep photo refs (label, num, caption) but mark as needing re-attachment
          photos: (item.photos || []).map(p => ({
            photoId: p.photoId,
            num: p.num,
            photoLabel: p.photoLabel,
            caption: p.caption || '',
            _needsReattach: true,
            saveStatus: 'missing'
          }))
        }]))
      }
    };
    const blob = new Blob([JSON.stringify(exportData, null, 2)], {
      type: 'application/json'
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${cur.fileNo}_${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    showToast('✅ JSON exported — re-attach photos on other device');
  }
  async function importJSON(file) {
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data.wwwExportVersion || !data.inspection) {
        showToast('Invalid export file', 'error');
        return;
      }
      const imported = {
        ...data.inspection,
        _importedAt: new Date().toISOString(),
        _importedFrom: data.exportedFrom
      };
      await dbPut('inspections', imported);
      setList(prev => {
        const i = prev.findIndex(x => x.id === imported.id);
        const n = [...prev];
        i >= 0 ? n[i] = imported : n.unshift(imported);
        return n;
      });
      const photoCount = Object.values(imported.items || {}).reduce((acc, d) => acc + (d.photos?.length || 0), 0);
      showToast(`✅ Imported: ${imported.insp?.address || 'No address'}${photoCount > 0 ? ` — ${photoCount} photo(s) need re-attaching` : ''}`);
    } catch (err) {
      showToast('Import failed: ' + err.message, 'error');
    }
  }

      // ── Typography ──

      const rb = (text, opts = {}) => r(text, {

      const h1P = text => new Paragraph({

      const h2P = (text, color = TEAL) => new Paragraph({

      const p = (text, opts = {}) => new Paragraph({

        },

      });
      const gap = (n = 120) => new Paragraph({

        },
        children: [r('')]
      });
      const pb = () => new Paragraph({

      // ── Info table (2-col label|value) ──
      const infoTbl = rows => new Table({
        width: {
          size: 9026,
          type: WidthType.DXA
        },
        columnWidths: [2800, 6226],
        rows: rows.map(([lbl, val], i) => new TableRow({
